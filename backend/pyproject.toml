[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so plain `pytest` (as in CI) can import the app package

[tool.ruff.lint.per-file-ignores]
"app/routes/public.py" = ["E501"]
