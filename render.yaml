# One-click deploy: Render → New → Blueprint → pick this repo.
services:
  - type: web
    name: my-expance-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free          # trial: sleeps after 15 min idle. Use "starter" for an always-on API.
    healthCheckPath: /health
    envVars:
      - key: AUTH_MODE
        value: firebase
      - key: DATABASE_URL
        fromDatabase:
          name: my-expance-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq     # free tier; switch to "anthropic" and add ANTHROPIC_API_KEY for Claude
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: DEVELOPER_NAME
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CHAT_DAILY_LIMIT
        value: "60"

databases:
  - name: my-expance-db
    region: singapore
    plan: free          # trial: Render deletes free databases after 30 days. Use "basic-256mb" to keep data.
    databaseName: myexpance
    user: myexpance
